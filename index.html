  <script>
  // Light / dark mode (docs/PLAN-rebrand-phurtix.md §5). Included FIRST in the <head> of every page, so <html data-theme>
  // is set before the first paint and the page never flashes the other mode. The choice is per device: "light", "dark",
  // or nothing saved = Auto, which follows the phone's or computer's setting and switches live when that changes.
  // The colours themselves live in SharedStyles.html (:root and :root[data-theme="dark"]); the switch is
  // renderThemeSwitch_ in SharedUI.html. This is the only code that reads or writes the ssTheme key.
  (function () {
    var KEY = 'ssTheme';
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    function choice() {
      try { var v = localStorage.getItem(KEY); return v === 'light' || v === 'dark' ? v : 'auto'; } catch (e) { return 'auto'; }
    }
    function mode() { var c = choice(); return c === 'auto' ? (mq && mq.matches ? 'dark' : 'light') : c; }
    function apply() {
      var m = mode();
      document.documentElement.setAttribute('data-theme', m);
      try { document.dispatchEvent(new CustomEvent('ss-theme-change', { detail: { choice: choice(), mode: m } })); } catch (e) { /* very old browser: no live update of the switch */ }
    }
    function set(c) {
      try { if (c === 'light' || c === 'dark') localStorage.setItem(KEY, c); else localStorage.removeItem(KEY); } catch (e) { /* storage blocked: applies to this page only */ }
      apply();
    }
    window.ssTheme_ = { choice: choice, mode: mode, set: set };
    apply();
    if (mq) {
      var onSystem = function () { if (choice() === 'auto') apply(); };
      if (mq.addEventListener) mq.addEventListener('change', onSystem); else if (mq.addListener) mq.addListener(onSystem);
    }
    window.addEventListener('storage', function (e) { if (e.key === KEY) apply(); });   // changed in another tab
  })();
</script>

    <style>
    /* ===== Colors & Tokens =====
       THE palette: every colour V1 shows is defined here and nowhere else
       (both apps and the landing page include this file first). Everywhere
       else uses var(--ss-…) — or rgba(var(--ss-…-rgb), alpha) for a
       see-through shade — and single-source.test.js fails on any colour
       value written outside this block. The only copies are where CSS
       variables can't reach, each checked by that test to match its token:
       the two SVG icons in Styles.html (= --ss-cream / --ss-copper). The cream
       chevron sits on the green, which is the same in both modes; the copper
       magnifier sits on a search field (--ss-surface) and stays 3:1 on it in
       both modes. The brand images (BrandAssets.html) are made from this
       palette by Brand/rebuild-runner.py, which reads it from this file.
       Shade names are family + lightness %, so a palette change edits only
       this block (then re-run that script).
       Light and dark mode: :root holds the light values; the dark block below
       gives every token that changes its dark value. Use a ROLE token for
       anything that sits on a card or the page (--ss-surface, --ss-page,
       --ss-text, --ss-heading, --ss-accent-ink, --ss-on-fill …), not a
       colour-by-name one — "white" is a card in light mode and dark grey in
       dark mode. */
    :root {
      /* Brand */
      --ss-green-rgb: 26, 54, 38;
      --ss-green: rgb(var(--ss-green-rgb));
      --ss-green-deep-rgb: 14, 31, 22;
      --ss-green-deep: rgb(var(--ss-green-deep-rgb));
      --ss-green-soft: #24452F;
      --ss-copper-rgb: 193, 125, 89;
      --ss-copper: rgb(var(--ss-copper-rgb));
      --ss-copper-light-rgb: 222, 158, 119;
      --ss-copper-light: rgb(var(--ss-copper-light-rgb));
      --ss-copper-dark: #955737;   /* text on cream/tints ≥4.5:1, white on it 5.7:1 */
      --ss-copper-deep: #7A4329;   /* end of the copper button gradient */
      --ss-cream-rgb: 244, 244, 240;
      --ss-cream: rgb(var(--ss-cream-rgb));
      /* Text — the only colours text uses on light backgrounds (each ≥4.5:1 on white, cream and the pale tints) */
      --ss-text: var(--ss-charcoal);
      --ss-heading: var(--ss-green);   /* headings, links and outlined controls on a light surface */
      --ss-heading-soft: var(--ss-green-soft);
      --ss-accent-ink: var(--ss-copper-dark);   /* copper text, outlines and the focus ring on a light surface */
      --ss-danger-ink: var(--ss-danger);   /* red text and outlines (a red FILL is --ss-danger) */
      --ss-danger-ink-strong: var(--ss-danger-deep);
      --ss-success-ink: var(--ss-success);
      --ss-on-fill: var(--ss-white);   /* text and icons on a coloured fill (buttons, badges, active chips) — white in both modes */
      --ss-on-dark-muted: var(--ss-silver);   /* quiet text on the green bars */
      --ss-text-muted: #5F6A62;    /* labels, hints, secondary values (was 16 different greys, many below 3:1) */
      --ss-text-subtle: #66706A;   /* placeholders, "optional", disabled, separators — on white/cream only (4.66:1 on cream) */
      --ss-border: var(--ss-silver);   /* hairline dividers (was used but never defined, so they didn't draw) */
      --ss-border-input: #858E87;   /* the outline of a field you type in or pick from — ≥3:1 on white and cream (silver was 1.3:1, so fields barely showed) */
      /* Surfaces */
      --ss-page: var(--ss-cream);   /* the page behind the cards, and quiet panels */
      --ss-surface-rgb: var(--ss-white-rgb);   /* cards, fields, dialogs */
      --ss-surface: rgb(var(--ss-surface-rgb));
      --ss-divider: var(--ss-cream);   /* a hairline between rows on a card */
      /* Base neutrals */
      --ss-white-rgb: 255, 255, 255;
      --ss-white: rgb(var(--ss-white-rgb));
      --ss-silver-rgb: 211, 214, 212;
      --ss-silver: rgb(var(--ss-silver-rgb));
      --ss-silver-dark: #9A9A9A;
      --ss-charcoal: #2A332C;
      --ss-black-rgb: 0, 0, 0;
      --ss-black: rgb(var(--ss-black-rgb));
      /* Status */
      --ss-danger-rgb: 169, 65, 47;   /* was 184,74,57: 4.3 on its pale-red tint */
      --ss-danger: rgb(var(--ss-danger-rgb));
      --ss-danger-deep: #8F392B;
      --ss-success-rgb: 46, 112, 72;   /* was 62,142,90: white on it 4.0, on its tint 3.4 */
      --ss-success: rgb(var(--ss-success-rgb));
      /* Section accents (workout tags / coach section bands) */
      --ss-teal: #3E7C8C;
      --ss-plum: #7C5C8C;
      --ss-sage: #557763;   /* was #5C7F6A: white tag-pill text 4.5:1 */
      --ss-amber: #8A5F22;   /* was #A8742A: white tag-pill text 4.0:1 */
      --ss-slate: #4A6788;
      /* Neutral shades (number = lightness %) */
      --ss-neutral-98: #FAFAF8;
      --ss-neutral-96: #F6F6F2;
      --ss-neutral-95: #F3F3F0;
      --ss-neutral-94: #F1F1EE;
      --ss-neutral-91: #EAEAE6;
      /* Green shades (number = lightness %) */
      --ss-green-94: #ECF5EE;
      --ss-green-93: #F0F4E6;
      --ss-green-92: #ECEEE9;
      --ss-green-90: #D6F5E0;
      --ss-green-90-2: #E2EBE5;
      --ss-green-71: #85E3B0;
      --ss-green-70-rgb: 143, 214, 166;
      --ss-green-70: rgb(var(--ss-green-70-rgb));
      --ss-green-30: #2C6B45;
      --ss-green-24: #1F5A3A;
      --ss-green-5: #081109;
      /* Teal shades (number = lightness %) */
      --ss-teal-94: #E8F4F6;
      /* Blue shades (number = lightness %) */
      --ss-blue-94: #ECEFF5;
      /* Purple shades (number = lightness %) */
      --ss-purple-95: #F3ECF6;
      /* Red shades (number = lightness %) */
      --ss-red-95: #FCECEA;
      --ss-red-76: #F59B91;
      --ss-red-38: #963A2C;
      /* Copper shades (number = lightness %) */
      --ss-copper-97: #FFF6F0;
      --ss-copper-95: #FDF3E8;
      --ss-copper-93: #F7EBE5;
      --ss-copper-32: #A35B00;
      /* Amber shades (number = lightness %) */
      --ss-amber-95: #FFF6E6;
      --ss-amber-92: #FDF7DA;
      --ss-amber-34: #6B5A40;
      /* Shadows */
      --ss-card-shadow: 0 6px 18px rgba(var(--ss-green-deep-rgb), 0.08);
    }
    /* Dark mode — on when <html data-theme="dark"> (ThemeBoot.html sets it before the first paint: the saved choice, or the
       system setting on Auto). Every token in :root either has its dark value here or is in this list, which stays the same in
       both modes because it only ever sits on the green bars and coloured fills, or is one:
       SAME IN BOTH: green green-rgb green-deep green-deep-rgb green-soft copper copper-rgb copper-light copper-light-rgb copper-dark
       copper-deep cream cream-rgb white white-rgb black black-rgb danger danger-rgb danger-deep success success-rgb teal plum sage
       amber slate green-71 green-70 green-70-rgb green-90 green-24 green-5 red-76 red-38 silver-rgb on-fill
       FOLLOWS ITS TOKEN: border surface
       (border is silver; surface is built from surface-rgb.)
       (single-source.test.js checks the list is complete and runs every contrast check in both modes.) */
    :root { color-scheme: light; }
    :root[data-theme="dark"] {
      color-scheme: dark;
      /* Roles */
      --ss-text: #E6ECE8;
      --ss-heading: #9BD1AE;
      --ss-heading-soft: #8EC6A2;
      --ss-accent-ink: #E6A783;
      --ss-danger-ink: #F2907F;
      --ss-danger-ink-strong: #F6A99B;
      --ss-success-ink: #82D0A0;
      --ss-text-muted: #A8B4AC;
      --ss-text-subtle: #93A098;
      --ss-border-input: #77877D;
      /* Surfaces */
      --ss-page: #0F1612;
      --ss-surface-rgb: 24, 33, 28;
      --ss-divider: #26302A;
      --ss-silver: #3B4841;   /* the -rgb channels stay light: their see-through outlines sit on the green bars */
      --ss-on-dark-muted: rgb(var(--ss-silver-rgb));
      --ss-silver-dark: #66756C;
      --ss-charcoal: #3A463F;
      /* Neutral shades */
      --ss-neutral-98: #1B241F;
      --ss-neutral-96: #1D2621;
      --ss-neutral-95: #1F2823;
      --ss-neutral-94: #212A25;
      --ss-neutral-91: #2B3530;
      /* Tints become deep washes of the same hue */
      --ss-green-94: #172A1F;
      --ss-green-93: #1F2B17;
      --ss-green-92: #1F2922;
      --ss-green-90-2: #1B3024;
      --ss-teal-94: #13292E;
      --ss-blue-94: #19212E;
      --ss-purple-95: #271D2C;
      --ss-red-95: #301A16;
      --ss-copper-97: #2A1F18;
      --ss-copper-95: #2D2119;
      --ss-copper-93: #34261D;
      --ss-amber-95: #2D2514;
      --ss-amber-92: #2B2714;
      /* Dark shades used as text on a wash become light */
      --ss-green-30: #86D3A2;
      --ss-copper-32: #EBAA6A;
      --ss-amber-34: #E2CB9E;
      /* Shadows */
      --ss-card-shadow: 0 6px 18px rgba(var(--ss-black-rgb), 0.35);
    }

    /* ===== Base / Reset ===== */
    * { box-sizing: border-box; }
    ::placeholder { color: var(--ss-text-subtle); opacity: 1; }   /* the browser default grey is 3.6:1 on a dark field */
    body { font-family: 'Inter', sans-serif; background: var(--ss-page); color: var(--ss-text); margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

    /* ===== Accessibility floor (shared by both apps) =====
       A visible keyboard focus ring on every interactive element (WCAG 2.4.7).
       Scoped to :focus-visible so it only shows for keyboard/AT users, not on
       mouse click. Several page-specific rules in Styles.html / ClientStyles.html
       set `outline: none` on plain :focus and come later in the cascade, so the
       ring is marked !important here to survive them — a standard a11y safety
       net, deliberately the one place we do this. */
    a:focus-visible, button:focus-visible, input:focus-visible,
    select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible,
    [role="button"]:focus-visible, [role="tab"]:focus-visible,
    [onclick]:focus-visible {
      outline: 2px solid var(--ss-accent-ink) !important;   /* copper was 3.0:1 on cream and under 3:1 on the pale tints */
      outline-offset: 2px;
    }
    /* On the dark green surfaces the ring turns light copper (copper-dark there is under 3:1). */
    :is(.top-bar, .nav-links, .dashboard-bar, .tool-page-head, .tool-hero-grid, .profile-hero, .macro-visualizer > div:first-child,
        .timer-panel, .timer-bar, .undo-toast, .toast, .account-modal-header, .login-brand, .coach-login-brand, .home-brand,
        .save-scope-group, .dash-box, .exd-demo) :focus-visible {
      outline-color: var(--ss-copper-light) !important;
    }
    /* Visually-hidden but screen-reader-available (live-region status nodes,
       off-screen labels). Shared a11y utility for both apps. */
    .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    /* Respect a reduced-motion preference across both apps. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ===== Toast =====
       Used via the shared showToast() in SharedUI.html */
    .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); min-width: 240px; max-width: 90%; padding: 14px 20px; border-radius: 10px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13.5px; letter-spacing: 0.3px; color: var(--ss-on-fill); box-shadow: 0 10px 26px rgba(var(--ss-green-deep-rgb), 0.35); z-index: 1200; opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.toast-success { background: linear-gradient(135deg, var(--ss-green) 0%, var(--ss-green-deep) 100%); border: 1px solid var(--ss-copper); }
    .toast.toast-error { background: linear-gradient(135deg, var(--ss-danger) 0%, var(--ss-danger-deep) 100%); border: 1px solid rgba(var(--ss-white-rgb), 0.25); }

    /* Undo toast — showUndoToast_() in SharedUI.html. A separate element from
       #toast so a plain toast during the undo window can't clobber the
       action. Sits just above where #toast appears. */
    .undo-toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px); display: flex; align-items: center; gap: 14px; max-width: 92%; padding: 12px 14px 12px 18px; border-radius: 10px; background: linear-gradient(135deg, var(--ss-green) 0%, var(--ss-green-deep) 100%); border: 1px solid var(--ss-copper); color: var(--ss-on-fill); font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13.5px; box-shadow: 0 10px 26px rgba(var(--ss-green-deep-rgb), 0.35); z-index: 1200; opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease; }
    .undo-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .undo-toast-btn { flex: 0 0 auto; background: rgba(var(--ss-white-rgb), 0.14); color: var(--ss-on-fill); border: 1px solid rgba(var(--ss-white-rgb), 0.35); border-radius: 7px; padding: 8px 16px; min-height: 40px; font-family: 'League Spartan', sans-serif; font-weight: 700; font-size: 12.5px; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; }
    .undo-toast-btn:hover { background: rgba(var(--ss-white-rgb), 0.24); }

    /* ===== Floating menu (openMenu_ / openFloatingPanel_ in SharedUI.html) =====
       A JS-tethered action menu — deliberately not the Popover API / CSS
       anchor positioning (Apps Script's sandboxed iframe + CSP + no build
       step rule out the needed polyfills). role="menu" with a real
       Up/Down/Home/End keyboard contract. */
    .floating-menu { position: fixed; z-index: 1300; min-width: 168px; background: var(--ss-surface); border: 1px solid var(--ss-silver); border-radius: 10px; box-shadow: 0 12px 32px rgba(var(--ss-green-deep-rgb), 0.22); padding: 6px; display: flex; flex-direction: column; }
    .floating-menu[hidden] { display: none; }
    .floating-menu-item { display: block; width: 100%; text-align: left; background: none; border: none; border-radius: 7px; padding: 11px 12px; min-height: 44px; font-family: 'Inter', sans-serif; font-size: 13.5px; font-weight: 600; color: var(--ss-text); cursor: pointer; }
    .floating-menu-item:hover { background: var(--ss-page); }
    .floating-menu-item.is-danger { color: var(--ss-danger-ink-strong); }
    .floating-menu-item:disabled { color: var(--ss-text-subtle); cursor: not-allowed; }

    /* ===== Inline field validation (shared) =====
       "Validate at the right moment, in place" — an error beside the field
       with fix-oriented wording, never colour-only. */
    .is-invalid, input.is-invalid, select.is-invalid { border-color: var(--ss-danger-ink) !important; background-color: var(--ss-red-95); }
    .field-error { display: none; margin-top: 5px; font-size: 12px; font-weight: 600; color: var(--ss-danger-ink-strong); }
    .field-error::before { content: "⚠ "; }
    .field-error.show { display: block; }

    /* ===== Inline banner (shared) =====
       A non-modal status strip above a work area — e.g. the Program
       Builder's "phase changed since you fetched" / "these aren't in the
       library" notices. */
    .inline-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 600; margin-bottom: 14px; }
    .inline-banner[hidden] { display: none; }
    .inline-banner-warn { background: rgba(var(--ss-copper-rgb), 0.12); border: 1px solid rgba(var(--ss-copper-rgb), 0.4); color: var(--ss-accent-ink); }
    .inline-banner-error { background: var(--ss-red-95); border: 1px solid var(--ss-danger-ink); color: var(--ss-danger-ink-strong); }
    /* Neutral status, not a problem — e.g. "you're editing a future phase in
       advance." Same shape as -warn/-error, calmer color. */
    .inline-banner-info { background: rgba(var(--ss-green-rgb), 0.07); border: 1px solid rgba(var(--ss-green-rgb), 0.25); color: var(--ss-heading); }
    .inline-banner .inline-banner-action { margin-left: auto; background: var(--ss-surface); border: 1px solid currentColor; border-radius: 7px; padding: 7px 12px; min-height: 36px; font-family: 'League Spartan', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.4px; color: inherit; cursor: pointer; }

    /* ===== Skeleton placeholder (shared) — reduced-motion aware ===== */
    .skeleton { position: relative; overflow: hidden; background: var(--ss-silver); border-radius: 8px; }
    .skeleton::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(var(--ss-surface-rgb), 0.55), transparent); animation: skeletonSweep 1.3s infinite; }
    @keyframes skeletonSweep { 100% { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) { .skeleton::after { animation: none; } }

    /* ===== Sortable rows (makeSortable_ in SharedUI.html) ===== */
    .is-dragging { opacity: 0.65; }
    .is-grabbed { box-shadow: 0 0 0 2px var(--ss-copper); }
    [data-drag-handle] { touch-action: none; }

    /* ===== Form Fields =====
       Previously drifted slightly between the two apps (margin, an
       unnecessary box-sizing override already covered by the universal
       reset above); standardized on one shared version. */
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--ss-heading); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input { width: 100%; padding: 13px 14px; border: 1.5px solid var(--ss-border-input); border-radius: 8px; font-size: 16px; background: var(--ss-page); transition: 0.2s; }
    .form-group input:focus { outline: none; border-color: var(--ss-copper); background: var(--ss-surface); box-shadow: 0 0 0 3px rgba(var(--ss-copper-rgb), 0.15); }

    /* ===== Buttons =====
       Primary action button — previously drifted slightly between the two
       apps (font-weight/size, letter-spacing); standardized on one shared
       version. Each app may still add its own extra states (e.g. :active). */
    .btn-primary { background: linear-gradient(135deg, var(--ss-copper-dark) 0%, var(--ss-copper-deep) 100%); color: var(--ss-on-fill); border: none; width: 100%; padding: 15px; font-weight: 700; font-family: 'League Spartan', sans-serif; font-size: 15px; letter-spacing: 1.5px; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 12px rgba(var(--ss-copper-rgb), 0.35); transition: 0.2s; }
    .btn-primary:hover { box-shadow: 0 6px 16px rgba(var(--ss-copper-rgb), 0.45); }
    /* Smaller, non-full-width secondary action — paired buttons inside a
       modal (Save/Cancel, Copy/Cancel, Change Username/Change Password),
       used identically by both apps. Moved here (was Coach-only) once the
       Client app started needing the same Account/Edit-Profile modal
       pattern (PLAN_userid_and_profiles.md §4/§9) rather than duplicating
       it — each app may still layer its own extra variants (e.g. Coach's
       .tool-action-row/.save-scope-group sizing) on top. */
    .btn-action { min-height: 44px; background: linear-gradient(135deg, var(--ss-copper-dark) 0%, var(--ss-copper-deep) 100%); color: var(--ss-on-fill); border: none; cursor: pointer; font-weight: 700; letter-spacing: 0.5px; transition: 0.2s; box-shadow: 0 3px 10px rgba(var(--ss-copper-rgb), 0.3); }
    /* No padding/border-radius/font-size in the base rule — exactly as it
       was when Coach-only, so nothing already using it app-wide shifts
       appearance. Every call site (both apps) sets its own padding/radius
       inline, same convention already used throughout this codebase.
       The one size it does set is the 44px touch-target floor (CLAUDE.md) —
       the assessment's Save button was 37px tall on a phone. */

    /* ===== Modals =====
       Generic overlay + card recipe reused by every modal in both apps
       (Account/Edit-Profile modals here, Program/Diet Builder tool modals
       in the Coach app) — one definition, not re-declared per app. */
    .modal-overlay { position: fixed; inset: 0; background: rgba(var(--ss-green-deep-rgb), 0.55); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; box-sizing: border-box; }
    .modal-box { background: var(--ss-surface); border-radius: 14px; padding: 26px; width: 380px; max-width: 100%; box-shadow: 0 20px 50px rgba(var(--ss-black-rgb), 0.3); box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
    .modal-box h3 { font-family: 'League Spartan', sans-serif; margin-bottom: 16px; color: var(--ss-heading); }
    .modal-help-text { font-size: 12.5px; color: var(--ss-text-muted); margin: -8px 0 16px; line-height: 1.4; }
    .modal-btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .modal-btn-row button { flex: 1 1 120px; }

    /* View Profile — read-only rows (PLAN_userid_and_profiles.md §9), used
       by both apps' View/Edit Profile + Account screens. A simple
       label/value list rather than reusing .profile-grid's input boxes, so
       a read-only screen doesn't look like a disabled form. */
    .profile-view-list { display: flex; flex-direction: column; }
    .profile-view-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--ss-divider); }
    .profile-view-row:last-child { border-bottom: none; }
    /* The Appearance switch (renderThemeSwitch_ in SharedUI.html): Auto / Light / Dark as one segmented radio group. */
    .theme-switch-row { flex-wrap: wrap; align-items: center; }
    .theme-switch { display: inline-flex; flex: 0 0 auto; border: 1.5px solid var(--ss-border-input); border-radius: 10px; overflow: hidden; }
    .theme-switch label { position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 64px; padding: 0 14px; margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.2px; text-transform: none; color: var(--ss-text); background: var(--ss-surface); cursor: pointer; }
    .theme-switch label + label { border-left: 1px solid var(--ss-border-input); }
    .theme-switch input { position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0; pointer-events: none; }
    .theme-switch label:has(input:checked) { background: var(--ss-green); color: var(--ss-on-fill); }
    .theme-switch label:has(input:focus-visible) { outline: 2px solid var(--ss-accent-ink); outline-offset: -4px; }
    .theme-switch label:has(input:checked:focus-visible) { outline-color: var(--ss-on-fill); }   /* on the green fill */
    .theme-switch-note { flex: 1 1 100%; font-size: 12px; color: var(--ss-text-muted); }
    .pv-label { font-size: 12px; font-weight: 700; color: var(--ss-text-muted); text-transform: uppercase; letter-spacing: 0.4px; flex: 0 0 auto; }
    .pv-value { font-size: 14.5px; font-weight: 600; color: var(--ss-text); text-align: right; word-break: break-word; }
    .req-marker { color: var(--ss-accent-ink); font-weight: 700; }

    /* Card + section-label recipe — originated in the Client app's
       Training/Nutrition/Profile cards, now shared since the Coach app's
       My Account modal (and any future coach-side card content) uses the
       same visual language rather than inventing a second one. */
    .protocol-card { background: var(--ss-surface); border: 1px solid var(--ss-silver); border-radius: 14px; padding: 18px; margin-bottom: 0; box-shadow: 0 3px 10px rgba(var(--ss-green-deep-rgb), 0.06); transition: 0.2s; border-top: 3px solid var(--ss-copper); box-sizing: border-box; }
    /* Scoped to real hover-capable pointers only — on touch devices, a :hover
       rule on an ancestor of a tappable child makes iOS/mobile Safari
       consume the first tap to trigger :hover and only fire the actual
       click on a second tap. Gating it here means touch devices never see
       the rule, so a single tap acts immediately. */
    @media (hover: hover) and (pointer: fine) {
      .protocol-card:hover { box-shadow: 0 6px 18px rgba(var(--ss-green-deep-rgb), 0.12); }
    }
    /* ===== ExerciseDetails (ExerciseDetails.html) — ONE screen for client and coach; plan §4.2 =====
       Layering (S17), one place: toast 1200 > timer 1050 > video demo 1040 > this screen 1010 > the sticky headers (90/100). Two presentations of
       the same markup: a modal screen (a full-height sheet on a phone, a 480 px panel from 768 px) and an inline pane inside the coach gallery. */
    .timer-overlay { z-index: 1050; }
    .video-demo-overlay { z-index: 1040; }
    .exd-overlay { z-index: 1010; align-items: flex-end; justify-content: center; padding: 0; }
    .exd-screen { display: flex; flex-direction: column; width: 100%; max-width: none; height: 92vh; height: 92dvh; max-height: none; margin: 0; padding: 0; overflow: hidden; border-radius: 18px 18px 0 0; }
    @media (min-width: 768px) { .exd-overlay { align-items: stretch; justify-content: flex-end; } .exd-screen { width: 480px; max-width: 100%; height: 100%; border-radius: 0; } }
    .exd-root { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; min-width: 0; }
    .exd-head { display: flex; align-items: flex-start; gap: 8px; flex: 0 0 auto; padding: 14px 10px 10px 16px; background: var(--ss-surface); border-bottom: 1px solid var(--ss-divider); }
    .exd-title { flex: 1 1 auto; min-width: 0; }
    .exd-name { margin: 0; font-family: 'League Spartan', sans-serif; font-size: 20px; line-height: 1.2; color: var(--ss-heading); overflow-wrap: anywhere; }
    .exd-name:focus-visible { outline: 2px solid var(--ss-copper); outline-offset: 2px; }
    .exd-sub { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .exd-type, .exd-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; background: var(--ss-page); color: var(--ss-accent-ink); }
    .exd-tag { background: var(--ss-red-95); color: var(--ss-danger-ink-strong); }
    .exd-x, .exd-back { flex: 0 0 auto; min-width: 44px; min-height: 44px; background: none; border: none; border-radius: 10px; font-size: 19px; font-weight: 800; color: var(--ss-heading); cursor: pointer; }
    .exd-x:hover, .exd-back:hover { background: var(--ss-page); }
    .exd-x:focus-visible, .exd-back:focus-visible, .exd-tab:focus-visible, .exd-demo:focus-visible, .exd-link:focus-visible, .exd-sim:focus-visible, .exd-action:focus-visible, .exd-lib summary:focus-visible { outline: 2px solid var(--ss-copper); outline-offset: 2px; }
    .exd-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 12px 16px 18px; }
    .exd-glance { margin-bottom: 12px; }
    .exd-demo { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; margin-bottom: 10px; background: var(--ss-green); color: var(--ss-on-fill); border: none; border-radius: 12px; font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.4px; cursor: pointer; }

    .exd-tab[aria-selected="true"] { background: var(--ss-surface); color: var(--ss-heading); box-shadow: 0 1px 4px rgba(var(--ss-green-deep-rgb), 0.15); }
    .exd-sec { margin: 0 0 16px; }

    .exd-desc { margin: 0 0 8px; font-size: 14px; line-height: 1.5; color: var(--ss-text); overflow-wrap: anywhere; }
    .exd-cues { margin: 0 0 6px; padding-left: 22px; font-size: 14px; line-height: 1.45; color: var(--ss-text); }
    .exd-cues li { margin-bottom: 5px; overflow-wrap: anywhere; }
    .exd-warn { margin: 0; padding: 10px 12px 10px 28px; background: var(--ss-page); border-left: 3px solid var(--ss-danger-ink); border-radius: 0 8px 8px 0; font-size: 13.5px; color: var(--ss-text); }
    .exd-warn li { margin-bottom: 4px; overflow-wrap: anywhere; }
    .exd-muscles { margin: 0 0 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
    .exd-muscles b { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--ss-accent-ink); }
    .exd-where { font-weight: 400; color: var(--ss-text-muted); }
    .exd-similar, .exd-plain { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .exd-plain li { font-size: 14px; }
    .exd-sim { display: flex; flex-direction: column; align-items: flex-start; width: 100%; min-height: 48px; padding: 8px 12px; background: var(--ss-surface); border: 1px solid var(--ss-silver); border-radius: 10px; text-align: left; font-family: 'Inter', sans-serif; cursor: pointer; }
    .exd-sim-name { font-weight: 700; font-size: 14px; color: var(--ss-text); }
    .exd-sim-why { font-size: 12px; color: var(--ss-text-muted); }
    .exd-dl { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 14px; }
    .exd-dl dt { font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--ss-accent-ink); }
    .exd-dl dd { margin: 0; font-weight: 700; font-size: 14px; color: var(--ss-text); overflow-wrap: anywhere; }
    .exd-note { margin: 0 0 12px; padding: 9px 12px; background: var(--ss-page); border-left: 3px solid var(--ss-copper); border-radius: 0 8px 8px 0; font-size: 13px; font-weight: 600; color: var(--ss-accent-ink); }
    .exd-dim { margin: 0 0 12px; font-size: 13px; color: var(--ss-text-muted); }
    .exd-err { margin: 0 0 12px; font-size: 13.5px; font-weight: 600; color: var(--ss-danger-ink-strong); }
    .exd-link { min-height: 44px; padding: 4px 0; background: none; border: none; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; color: var(--ss-heading); text-decoration: underline; cursor: pointer; }
    .exd-skel { display: grid; gap: 8px; margin-bottom: 8px; }
    .exd-skel i { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--ss-green-92), var(--ss-neutral-96), var(--ss-green-92)); }
    .exd-skel i:nth-child(2) { width: 85%; } .exd-skel i:nth-child(3) { width: 60%; }
    .exd-lib { margin: 6px 0 0; padding-top: 10px; border-top: 1px solid var(--ss-divider); }
    .exd-lib summary { min-height: 44px; display: flex; align-items: center; font-weight: 700; font-size: 13px; color: var(--ss-accent-ink); cursor: pointer; }
    .exd-gaps { margin: 8px 0 0; font-size: 12.5px; font-weight: 600; color: var(--ss-danger-ink-strong); }
    .exd-actions { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--ss-surface); border-top: 1px solid var(--ss-divider); }
    .exd-act { flex: 1 1 140px; display: flex; flex-direction: column; gap: 3px; }
    .exd-action { width: 100%; min-height: 48px; padding: 0 14px; background: var(--ss-surface); color: var(--ss-heading); border: 1.5px solid var(--ss-heading); border-radius: 10px; font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 14px; cursor: pointer; }
    .exd-action.is-primary { background: var(--ss-green); color: var(--ss-on-fill); }

    /* Inline (the coach gallery's detail pane / card): same sections, not modal — its own scroll belongs to the pane. */
    .eg-detail .exd-body, .eg-card-detail .exd-body { overflow: visible; padding: 4px 0 8px; }
    .eg-detail .exd-head, .eg-card-detail .exd-head { padding: 0 0 8px; border-bottom: none; background: transparent; }
    .eg-detail .exd-actions, .eg-card-detail .exd-actions { padding: 8px 0 0; border-top: none; background: transparent; }
    /* ===== Exercise list: one-line rows + the ONE Current card (V1 client Performance; written to be reused by the coach app) =====
       docs/PLAN-v1-client-workout-states.md §4.1. State is an icon, a word and the accessible name — never colour alone. Rows are
       ≥ 44 px; nothing has a fixed width; the open card is the ordinary .protocol-card with a copper left bar. */
    .ex-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .ex-list + .ex-group-title, .ex-strip + .ex-list { margin-top: 10px; }
    .ex-item { display: flex; align-items: stretch; gap: 6px; scroll-margin-top: calc(var(--sticky-stack-h, 150px) + 8px); }
    .ex-item.is-current { display: block; }
    .ex-h { flex: 1 1 auto; min-width: 0; margin: 0; font: inherit; }
    .ex-row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 10px 14px; background: var(--ss-surface); border: 1px solid var(--ss-silver); border-radius: 12px;
      font-family: 'Inter', sans-serif; font-size: 14px; color: var(--ss-text); text-align: left; cursor: pointer; }
    .ex-row:hover { background: var(--ss-neutral-98); }
    .ex-row:focus-visible, .ex-undo:focus-visible, .ex-more:focus-visible, .ex-strip-btn:focus-visible, .btn-finish-ex:focus-visible, .ex-note-add:focus-visible, .ex-banner-btn:focus-visible { outline: 2px solid var(--ss-copper); outline-offset: 2px; }
    .ex-ic { flex: 0 0 22px; text-align: center; font-weight: 800; font-size: 15px; color: var(--ss-accent-ink); }
    .ex-name { flex: 1 1 auto; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ex-sum { flex: 0 1 46%; min-width: 0; font-size: 12px; color: var(--ss-text-muted); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ex-state-done .ex-ic { color: var(--ss-success-ink); }
    .ex-state-skipped, .ex-state-missed { background: var(--ss-page); }
    .ex-state-skipped .ex-name, .ex-state-missed .ex-name { font-weight: 600; color: var(--ss-text-muted); }
    .ex-undo { flex: 0 0 auto; min-height: 48px; min-width: 56px; padding: 0 14px; background: var(--ss-surface); border: 1.5px solid var(--ss-silver); border-radius: 12px; font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 0.4px; text-transform: uppercase; color: var(--ss-accent-ink); cursor: pointer; }
    .protocol-card.ex-current { border-left: 4px solid var(--ss-copper); }
    @media (hover: hover) and (pointer: fine) { .protocol-card.ex-current:hover { transform: none; } }
    .ex-state-chip { align-self: center; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; padding: 4px 9px; border-radius: 20px; background: var(--ss-page); color: var(--ss-accent-ink); white-space: nowrap; }
    .ex-state-chip[data-state="done"] { background: rgba(var(--ss-success-rgb), 0.14); color: var(--ss-green-30); }
    .ex-details-btn { flex: 0 0 auto; margin-left: auto; min-height: 44px; margin-top: -8px; padding: 0 12px; background: none; border: none; border-radius: 10px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; color: var(--ss-heading); text-decoration: underline; cursor: pointer; }
    .ex-details-btn:focus-visible { outline: 2px solid var(--ss-copper); outline-offset: 2px; }
    .ex-details-btn + .ex-more { margin-left: 0; }
    .ex-more { flex: 0 0 auto; margin-left: auto; min-width: 44px; min-height: 44px; margin-top: -8px; margin-right: -8px; background: none; border: none; border-radius: 10px; font-size: 20px; font-weight: 800; color: var(--ss-heading); cursor: pointer; }
    .ex-more:hover { background: var(--ss-page); }
    .ex-more { margin-right: 0; }
    /* Close (fold) the open exercise card — the header's last control, a ▴ the same size as ⋯. */
    .ex-collapse { flex: 0 0 auto; margin-left: auto; min-width: 44px; min-height: 44px; margin-top: -8px; margin-right: -8px; background: none; border: none; border-radius: 10px; font-size: 18px; font-weight: 800; color: var(--ss-heading); cursor: pointer; }
    .ex-more ~ .ex-collapse { margin-left: 0; }
    .ex-collapse:hover { background: var(--ss-page); }
    .ex-collapse:focus-visible { outline: 2px solid var(--ss-copper); outline-offset: 2px; }
    .ex-banner { margin: 2px 0 10px; padding: 10px 12px; border-radius: 8px; background: var(--ss-page); border-left: 3px solid var(--ss-copper); font-size: 13px; font-weight: 600; color: var(--ss-accent-ink); }
    .ex-banner-btn { min-height: 44px; padding: 4px 10px; background: none; border: none; font-family: inherit; font-weight: 800; font-size: 13px; color: var(--ss-heading); text-decoration: underline; cursor: pointer; }
    .ex-strip { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; padding: 12px 14px; border-radius: 12px; background: var(--ss-surface); border: 1px solid var(--ss-copper-light); }
    .ex-strip-msg { font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 15px; color: var(--ss-heading); }
    .ex-strip-btn { min-height: 44px; padding: 8px 14px; background: var(--ss-green); color: var(--ss-on-fill); border: none; border-radius: 10px; font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.4px; cursor: pointer; }
    .ex-group-title { margin: 18px 0 8px; font-family: 'League Spartan', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--ss-accent-ink); }
    .btn-finish-ex { display: block; width: 100%; min-height: 48px; margin: 10px 0 4px; background: var(--ss-green); color: var(--ss-on-fill); border: none; border-radius: 10px; font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.5px; cursor: pointer; }
    .btn-finish-ex[hidden] { display: none; }
    .ex-note-add { min-height: 44px; margin-top: 6px; padding: 8px 4px; background: none; border: none; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12.5px; color: var(--ss-accent-ink); cursor: pointer; }
    .ex-note { margin-top: 10px; }
    .meal-section-label { grid-column: 1 / -1; font-family: 'League Spartan', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--ss-heading-soft); margin: 18px 0 8px; padding-bottom: 6px; border-bottom: 2px solid var(--ss-copper); }
    .meal-section-label:first-child { margin-top: 0; }

    /* --- Account modal (My Account) — avatar header + sectioned cards.
       Generic (not app-prefixed) since either app's own account screen can
       reuse this — the Coach app's My Account modal is the first user. --- */
    .account-modal-box { width: min(94vw, 520px) !important; padding: 0 !important; overflow: hidden !important; display: flex; flex-direction: column; max-height: 90vh; }
    .account-modal-header { display: flex; align-items: center; gap: 14px; padding: 22px 24px 18px; background: linear-gradient(135deg, var(--ss-green) 0%, var(--ss-green-deep) 100%); flex: 0 0 auto; }
    .account-avatar { flex: 0 0 auto; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--ss-copper-dark) 0%, var(--ss-copper-deep) 100%); color: var(--ss-on-fill); display: flex; align-items: center; justify-content: center; font-family: 'League Spartan', sans-serif; font-weight: 700; font-size: 22px; box-shadow: 0 4px 12px rgba(var(--ss-black-rgb), 0.25); }
    .account-header-text { min-width: 0; flex: 1 1 auto; }
    .account-header-text h3 { margin: 0 0 6px; color: var(--ss-on-fill); font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .account-header-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .account-username-chip { font-size: 12px; font-weight: 700; color: var(--ss-cream); background: rgba(var(--ss-white-rgb), 0.1); padding: 3px 10px; border-radius: 10px; letter-spacing: 0.2px; }
    .account-modal-body { padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; flex: 1 1 auto; }
    .account-modal-body .modal-help-text { margin: -8px 0 0; }
    .account-modal-footer { padding: 16px 24px; border-top: 1px solid var(--ss-silver); flex: 0 0 auto; background: var(--ss-surface); }
    /* Username/Password rows — value + a small "Change" action inline,
       instead of two separate full-width buttons stacked underneath. */
    .pv-value-group { display: flex; align-items: center; gap: 10px; }
    .account-inline-link { background: none; border: none; padding: 0; margin: 0; font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--ss-accent-ink); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
    .account-inline-link:hover { color: var(--ss-accent-ink); }
    @media (max-width: 420px) {
      .account-modal-header { padding: 18px 18px 16px; gap: 12px; }
      .account-avatar { width: 46px; height: 46px; font-size: 18px; }
      .account-header-text h3 { font-size: 17px; }
      .account-modal-body, .account-modal-footer { padding-left: 18px; padding-right: 18px; }
    }

    /* ===== Login Page =====
       Only the card's entrance micro-interaction is genuinely identical
       between the two apps — the layout/breakpoint structure around it is
       NOT: Client is deliberately mobile-first/tablet-second/desktop-last
       (bespoke work invested in that order — see ClientStyles.html), Coach
       is deliberately desktop-first/mobile-second/tablet-last (a dedicated
       widescreen split-panel layout, a solid single-column mobile fallback,
       and tablet gets no bespoke breakpoint of its own — see Styles.html).
       Keep this keyframe here since both reference it by name; don't move
       the surrounding card/page rules back here even if they look similar
       again later — that similarity is coincidental, not structural. */
    @keyframes loginCardIn { from { opacity: 0; transform: translateY(16px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    /* The brand lockup (Utils.gs brandLogoHtml_) on the green brand panel of the landing page and both login screens: the logo
       artwork, then the name and tagline as live text. The panel, its padding and the artwork's size stay each page's own. */
    .brand-lockup { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
    .brand-wordmark { margin-top: 12px; font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 28px; line-height: 1; letter-spacing: 4px; text-transform: uppercase; color: var(--ss-cream); }
    .brand-tagline { margin-top: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.4px; color: var(--ss-copper-light); }
    /* The lockup in the top bar of both apps (owner, 2026-11-03): the transparent runner, the name in the logo's typeface and
       spacing, and the tagline under it. */
    .brand-bar-text { display: flex; flex-direction: column; justify-content: center; gap: 3px; min-width: 0; }
    .top-bar .brand-bar-name { margin: 0; font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 22px; line-height: 1; letter-spacing: 3.5px; text-transform: uppercase; color: var(--ss-cream); white-space: nowrap; }
    .brand-bar-tagline { font-size: 10.5px; font-weight: 600; letter-spacing: 0.3px; line-height: 1.1; color: var(--ss-copper-light); white-space: nowrap; }
    @media (max-width: 360px) { .top-bar .brand-group { gap: 8px; } .top-bar .brand-icon { height: 36px; } .top-bar .brand-bar-name { font-size: 18px; letter-spacing: 2px; } .brand-bar-tagline { font-size: 9.5px; letter-spacing: 0; } }   /* the smallest phones: the coach bar fits at 320px */
    /* The legal line at the foot of those cards (brandLegalFooterHtml_) — renders nothing until LEGAL_ENTITY_FINAL. */
    .brand-legal { margin: 18px 0 0; text-align: center; font-size: 11.5px; line-height: 1.5; color: var(--ss-text-muted); }

    /* ===== Comparison / Delta Display =====
       Body-composition delta display (baseline vs. latest checkpoint) — used
       on the Coach's Assessment tab and the Client's Progress tab. */
    .comp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .comp-box { background: var(--ss-page); border-radius: 10px; padding: 14px; text-align: center; }
    .comp-box .comp-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--ss-text-muted); letter-spacing: 0.3px; }
    .comp-box .comp-values { font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 18px; color: var(--ss-heading); margin: 4px 0; }
    .comp-box .comp-delta { font-size: 12.5px; font-weight: 700; }
    .comp-delta.up { color: var(--ss-danger-ink); }
    .comp-delta.down { color: var(--ss-success-ink); }
    .comp-delta.flat { color: var(--ss-text-muted); }

    /* ===== Pull-to-Refresh =====
       The trigger logic differs per app (each has its own
       setupPullToRefresh() in its own JavaScript file, since the views it
       refreshes differ), but the bar's look is identical. */
    .pull-refresh-bar { position: fixed; top: 0; left: 0; width: 100%; text-align: center; background: var(--ss-green); color: var(--ss-cream); font-size: 12.5px; font-weight: 700; padding: 10px; transform: translateY(-100%); transition: transform 0.2s ease; z-index: 998; }
    .pull-refresh-bar.visible { transform: translateY(0); }
    .pull-refresh-bar.ready { background: var(--ss-copper); }

    /* ===== What's New Popup =====
       The overlay and card contents are identical; the card's own max-width
       differs slightly per app and stays local. */
    .whats-new-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(var(--ss-green-deep-rgb), 0.75); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
    .whats-new-card h3 { font-family: 'League Spartan', sans-serif; color: var(--ss-heading); font-size: 19px; margin: 0 0 16px; }
    .whats-new-card ul { padding-left: 20px; margin: 0 0 20px; }
    .whats-new-card li { font-size: 14px; color: var(--ss-text); margin-bottom: 10px; line-height: 1.4; }

    /* ===== Exercise set rows (renderSetRow_ in SharedUI.html) =====
       The client's logger and the coach's Correct-sets modal draw a set the same way: ONE wrapping line — the set
       number, the boxes, then the timer / ✓ / delete pushed to the right; whatever doesn't fit wraps under it (never a
       horizontal scroll), and an in-place message takes a line of its own. Every control is ≥44px. */
    .set-stack { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .set-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px; padding: 8px; background: var(--ss-neutral-98); border: 1px solid var(--ss-neutral-91); border-radius: 8px; }
    .set-label { flex: 0 0 auto; min-width: 28px; height: 44px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; color: var(--ss-on-fill); background: var(--ss-green); border-radius: 6px; padding: 0 4px; font-size: 12px; }
    .set-fields { display: contents; }
    /* 58px: two boxes (weight + reps) still share one line beside the ✓ and ✕ on a 360px phone. */
    .set-field { position: relative; flex: 1 1 58px; min-width: 0; display: flex; flex-direction: column; }
    .set-field[hidden] { display: none; }
    .set-field-time { flex: 2 1 104px; }
    .set-field label { font-size: 10px; line-height: 1.2; font-weight: 700; color: var(--ss-text-muted); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 3px; }
    .set-field .set-unit { font-weight: 600; color: var(--ss-text-subtle); text-transform: none; letter-spacing: 0; }
    .set-field.is-opt label { color: var(--ss-text-subtle); font-weight: 600; }
    .set-field input { width: 100%; min-width: 0; min-height: 44px; padding: 8px 4px; border: 1.5px solid var(--ss-border-input); border-radius: 6px; font-family: inherit; font-size: 16px; text-align: center; background: var(--ss-surface); color: var(--ss-text); font-variant-numeric: tabular-nums; }
    .set-field.is-opt input { border-style: dashed; }
    .set-row { scroll-margin-bottom: 72px; }   /* a focused set must not sit behind the sticky save badge or the soft keyboard (plan S7) */
    .set-field input::placeholder { color: var(--ss-text-subtle); font-size: 12px; }
    .set-field input:focus { outline: none; border-color: var(--ss-copper); }
    .set-field input:disabled { background: var(--ss-neutral-95); color: var(--ss-text-muted); }
    .minsec { display: flex; align-items: center; gap: 2px; min-width: 0; }
    .minsec span { font-weight: 800; color: var(--ss-text-muted); }

    .set-actions { flex: 0 0 auto; margin-left: auto; display: flex; align-items: center; gap: 4px; }
    .set-check, .timer-btn { flex: 0 0 auto; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 1.5px solid var(--ss-silver); background: var(--ss-surface); color: var(--ss-text-muted); font-size: 18px; font-weight: 800; line-height: 1; cursor: pointer; }
    span.set-check { cursor: default; }
    .set-check.done { background: var(--ss-success); border-color: var(--ss-success); color: var(--ss-on-fill); }
    .btn-del-set { flex: 0 0 auto; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; background: var(--ss-red-95); color: var(--ss-danger-ink-strong); border: 1px solid rgba(var(--ss-danger-rgb), 0.3); border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .set-msg { flex: 1 1 100%; margin: 0; font-size: 12px; font-weight: 600; }
    .set-msg:empty { display: none; }
    .set-msg.is-error { color: var(--ss-danger-ink-strong); }
    .set-msg.is-error::before { content: "⚠ "; }
    .set-msg.is-hint { color: var(--ss-accent-ink); }
    /* ===== What a screen times, while the shared timer runs (SharedUI.html refreshTimer_) =====
       Any element rendered with data-timer-key gets .is-timing while that timer runs: its ⏱ button turns copper, and a
       [data-timer-readout] inside covers the box being timed (the box keeps its value underneath, untouched). */
    .timer-btn.is-timing { background: var(--ss-copper-dark); border-color: var(--ss-copper-dark); color: var(--ss-on-fill); }
    .timer-readout { display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 44px; align-items: center; justify-content: center; border: 1.5px solid var(--ss-copper); border-radius: 6px; background: var(--ss-copper-97); font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: 17px; color: var(--ss-accent-ink); font-variant-numeric: tabular-nums; }
    .is-timing > .timer-readout { display: flex; }
    .is-timing > input, .is-timing > .minsec { visibility: hidden; }
    @media (prefers-reduced-motion: no-preference) { .timer-readout { animation: timerPulse 1.6s ease-in-out infinite; } }
    @keyframes timerPulse { 50% { box-shadow: 0 0 0 3px rgba(var(--ss-copper-rgb), 0.25); } }
    /* A box with its own ⏱ beside it (the coach's assessment tests): the box and the button on one line. */
    .timer-field { position: relative; display: flex; align-items: flex-end; gap: 6px; min-width: 0; }
    .timer-field > input { flex: 1 1 auto; min-width: 0; }
    .timer-field > .time-sep { align-self: center; font-weight: 700; color: var(--ss-text); }

    /* ===== Demo video (SharedUI.html openVideoDemo_) — both apps ===== */
    .video-demo-box { width: 100%; max-width: 760px; padding: 12px 12px 14px; }
    .video-demo-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .video-demo-head h3 { margin: 0; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
    .video-demo-close { flex: 0 0 auto; min-width: 44px; min-height: 44px; border: none; border-radius: 8px; background: var(--ss-page); color: var(--ss-text); font-size: 18px; cursor: pointer; }
    .video-demo-close:focus-visible { outline: 2px solid var(--ss-copper); outline-offset: 2px; }
    .video-demo-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--ss-black); border-radius: 8px; overflow: hidden; }
    .video-demo-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .timer-field > .timer-readout { top: 0; height: auto; right: 50px; }

    /* ===== The timer (SharedUI.html startTimer_) — one stopwatch / countdown for every screen of both apps =====
       Full screen on a phone — one huge Stop, readable at arm's length — a dialog on a wide screen. */
    .timer-overlay { padding: 0; align-items: stretch; justify-content: center; background: rgba(var(--ss-green-deep-rgb), 0.92); }
    .timer-panel { width: 100%; max-width: 520px; height: 100%; display: flex; flex-direction: column; gap: 10px; padding: 24px 20px calc(20px + env(safe-area-inset-bottom)); background: var(--ss-green-deep); color: var(--ss-on-fill); text-align: center; }
    .timer-name { margin: 0; font-family: 'League Spartan', sans-serif; font-size: 22px; color: var(--ss-on-fill); overflow-wrap: break-word; }
    .timer-sub { margin: 0; font-size: 14px; font-weight: 600; color: var(--ss-copper-light); }
    .timer-big { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 120px; font-family: 'League Spartan', sans-serif; font-weight: 800; font-size: clamp(64px, 22vw, 120px); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
    .timer-aim { display: flex; flex-direction: column; gap: 6px; align-items: center; }
    .timer-aim[hidden] { display: none; }
    .timer-aim-track { width: 100%; height: 10px; border-radius: 5px; background: rgba(var(--ss-white-rgb), 0.15); overflow: hidden; }
    .timer-aim-fill { display: block; height: 100%; width: 0; background: var(--ss-copper); }
    .timer-aim-label { font-size: 13px; font-weight: 700; color: var(--ss-success-ink); visibility: hidden; }
    .timer-reached .timer-big { color: var(--ss-green-70); }
    .timer-reached .timer-aim-fill { background: var(--ss-success); }
    .timer-reached .timer-aim-label { visibility: visible; color: var(--ss-green-70); }
    .timer-ending .timer-big { color: var(--ss-copper-light); }                       /* a countdown's last 10 seconds */
    .timer-stop { flex: 0 0 auto; min-height: 34vh; max-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: none; border-radius: 22px; background: var(--ss-danger); color: var(--ss-on-fill); font-family: 'League Spartan', sans-serif; font-size: 40px; font-weight: 800; letter-spacing: 1px; cursor: pointer; touch-action: manipulation; }
    .timer-stop small { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0; opacity: 0.9; }
    .timer-stop:active { filter: brightness(0.92); }
    .timer-link { min-height: 44px; padding: 0 12px; background: none; border: 1px solid rgba(var(--ss-white-rgb), 0.35); border-radius: 10px; color: var(--ss-on-fill); font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; }
    .timer-link.timer-discard { border-color: transparent; color: var(--ss-copper-light); text-decoration: underline; text-underline-offset: 2px; }
    @media (min-width: 640px) {
      .timer-overlay { align-items: center; padding: 16px; background: rgba(var(--ss-green-deep-rgb), 0.75); }
      .timer-panel { height: auto; border-radius: 18px; padding: 28px; box-shadow: 0 20px 50px rgba(var(--ss-black-rgb), 0.4); }
      .timer-stop { min-height: 150px; }
    }
    /* Hidden but running: a small bar above the save badge, on every tab and day, that opens it again. */
    /* Minimised: a dock at the foot of the screen, full width up to 560 px — the time, what it times, ONE 44 px Stop (Skip for a rest) and, on the
       rest of the dock, a tap to open it full screen. Never over the middle of the page: the page gains room beneath its last row (body.has-timer-dock). */
    .timer-bar { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; z-index: 990; display: flex; align-items: stretch; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--ss-green-deep); color: var(--ss-on-fill); border-top: 2px solid var(--ss-copper); border-radius: 14px 14px 0 0; box-shadow: 0 -6px 18px rgba(var(--ss-green-deep-rgb), 0.28); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; }
    .timer-bar[hidden] { display: none; }
    .timer-bar-open { flex: 1 1 auto; min-width: 0; min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 6px; background: none; border: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .timer-bar-kind { flex: 0 0 auto; padding: 2px 8px; border-radius: 10px; background: rgba(var(--ss-white-rgb), 0.16); font-size: 11px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; }
    .timer-bar-kind:empty { display: none; }
    /* A rest is a different thing from a stopwatch: green dock, a REST tag, a Skip (not Stop) button — and one pulse when it begins, so a stop followed by a rest never reads as "still running". */
    .timer-bar.timer-bar-rest { background: var(--ss-green-24); border-top-color: var(--ss-green-70); }
    .timer-bar.timer-bar-rest .timer-bar-time { color: var(--ss-green-90); }
    .timer-bar.timer-bar-rest .timer-bar-act { background: rgba(var(--ss-white-rgb), 0.18); border: 1.5px solid rgba(var(--ss-white-rgb), 0.55); }
    @media (prefers-reduced-motion: no-preference) { .timer-bar.timer-bar-rest { animation: timerDockIn .6s ease-out; } }
    @keyframes timerDockIn { 0% { transform: translateY(100%); box-shadow: 0 0 0 0 rgba(var(--ss-green-70-rgb), 0.9); } 60% { transform: translateY(0); box-shadow: 0 0 0 14px rgba(var(--ss-green-70-rgb), 0); } 100% { transform: none; box-shadow: 0 -6px 18px rgba(var(--ss-green-deep-rgb), 0.28); } }
    .timer-bar-time { font-family: 'League Spartan', sans-serif; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ss-copper-light); }
    .timer-bar.timer-reached .timer-bar-time { color: var(--ss-green-70); }
    .timer-bar.timer-ending .timer-bar-time { color: var(--ss-on-fill); }
    .timer-bar-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .timer-bar-up { flex: 0 0 auto; opacity: 0.7; font-size: 16px; }
    .timer-bar-act { flex: 0 0 auto; min-width: 84px; min-height: 44px; padding: 0 18px; border: none; border-radius: 12px; background: var(--ss-danger); color: var(--ss-on-fill); font-family: 'League Spartan', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: 0.5px; cursor: pointer; touch-action: manipulation; }
    .timer-bar-act:active { filter: brightness(0.92); }
    .timer-bar-open:focus-visible, .timer-bar-act:focus-visible { outline: 2px solid var(--ss-copper-light); outline-offset: 2px; }
    body.has-timer-dock { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
    body.has-timer-dock .toast { bottom: calc(86px + env(safe-area-inset-bottom)); }
    body.has-timer-dock .undo-toast { bottom: calc(140px + env(safe-area-inset-bottom)); }
    .timer-add { flex: 0 0 auto; align-self: center; min-width: 120px; min-height: 52px; padding: 0 22px; border: 1.5px solid rgba(var(--ss-white-rgb), 0.45); border-radius: 26px; background: none; color: var(--ss-on-fill); font-family: 'League Spartan', sans-serif; font-size: 18px; font-weight: 800; cursor: pointer; touch-action: manipulation; }
    .timer-add[hidden] { display: none; }
    .timer-add:focus-visible { outline: 2px solid var(--ss-copper-light); outline-offset: 2px; }
    .timer-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

    /* A suggestion in an empty box (the client app's "fewest taps"): a faint figure, not a value until the client confirms. */
    .set-field input.has-suggest::placeholder { color: var(--ss-text-subtle); font-size: 16px; }
    /* The − / + bar above the focused box (setRowFocus_). Its buttons never take the focus, so a phone keypad stays open. */
    .set-nudge { position: fixed; z-index: 1250; display: flex; gap: 4px; padding: 3px; background: var(--ss-green); border-radius: 10px; box-shadow: 0 6px 16px rgba(var(--ss-green-deep-rgb), 0.25); }
    .set-nudge[hidden] { display: none; }
    .set-nudge button { min-width: 52px; min-height: 44px; padding: 0 10px; border: none; border-radius: 8px; background: rgba(var(--ss-white-rgb), 0.12); color: var(--ss-on-fill); font-family: inherit; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; cursor: pointer; touch-action: manipulation; }
    .set-nudge button:active { background: var(--ss-copper); }
    /* Wider screens: every box on one line, sized to its content instead of stretched edge to edge. */
    @media (min-width: 640px) { .set-field { flex: 0 1 112px; } .set-field-time { flex: 0 1 150px; } }

    /* ===== Layout Helpers =====
       Profile form 2-column-span helper (Client Profile / Assessment forms) */
    .vert-group-wide { grid-column: span 2; }
    @media(max-width: 420px) { .vert-group-wide { grid-column: span 1; } }
  
    /* ===== AdherenceView — "Plan vs. you" / "Plan vs. client" (AdherenceView.html) ===== */
    .adh { min-width: 0; }
    .adh-empty { padding: 12px 4px; color: var(--ss-text-muted); font-size: 14px; }
    .adh-empty p { margin: 4px 0 0; }
    .adh-follow { margin: 0 0 8px; padding: 8px 10px; background: var(--ss-page); border-radius: 8px; font-size: 13.5px; }
    .adh-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; margin: 0 0 8px; font-size: 13px; }
    .adh-crumb { padding: 0 2px; font-weight: 700; color: var(--ss-text); overflow-wrap: anywhere; }
    .adh-crumb-link { background: none; border: 0; min-height: 44px; padding: 0 8px; color: var(--ss-accent-ink); text-decoration: underline; cursor: pointer; font: inherit; font-weight: 700; }
    .adh-title { margin: 14px 0 6px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .adh-exlink { background: none; border: 0; padding: 0 2px; min-height: 44px; font: inherit; font-weight: 800; color: var(--ss-heading); text-decoration: underline; cursor: pointer; text-align: left; overflow-wrap: anywhere; }
    .adh-pill { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--ss-page); border: 1px solid var(--ss-silver); }
    .adh-figures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 10px; }
    .adh-figures > div { background: var(--ss-page); border-radius: 10px; padding: 8px 10px; min-width: 0; }
    .adh-figures dt { font-size: 11.5px; font-weight: 700; color: var(--ss-text-muted); text-transform: uppercase; letter-spacing: .03em; overflow-wrap: anywhere; }
    .adh-figures dd { margin: 2px 0 0; font-size: 22px; font-weight: 800; color: var(--ss-heading); }

    .adh-dots { background: radial-gradient(circle, var(--ss-text) 1.2px, transparent 1.6px) 0 0 / 5px 5px, var(--ss-silver); }
    .adh-open { background: var(--ss-surface); box-shadow: inset 0 0 0 2px var(--ss-danger); }

    .adh-legend li { display: flex; align-items: center; gap: 6px; }
    .adh-key { width: 14px; height: 10px; border-radius: 2px; flex: none; }
    .adh-how { font-size: 12.5px; color: var(--ss-text-muted); margin: 4px 0 8px; }
    .adh-how summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--ss-accent-ink); font-weight: 700; }
    .adh-how p { margin: 0 0 6px; }
    .adh-list { list-style: none; margin: 0; padding: 0; }
    .adh-row { border-top: 1px solid var(--ss-silver); }
    .adh-rowbtn { display: grid; grid-template-columns: minmax(0, 1fr) auto 18px; grid-template-areas: "name pct chev" "bar bar chev" "note note chev"; gap: 2px 10px; align-items: center; width: 100%; min-height: 44px; padding: 10px 2px; background: none; border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
    .adh-rowbtn:disabled { cursor: default; color: inherit; opacity: 1; }   /* a row with nothing to open is read-only, not switched off: full contrast */
    .adh-rowname { grid-area: name; font-weight: 700; overflow-wrap: anywhere; min-width: 0; }

    .adh-chev { grid-area: chev; font-size: 20px; color: var(--ss-text-muted); }
    .adh-extra { padding: 8px 2px; }

    .adh-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }

      .exd-hist td::before { content: attr(data-label) ": "; font-weight: 700; color: var(--ss-text-muted); }

    .lift-details-btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; margin: 4px 0 8px; background: none; border: 1.5px solid var(--ss-copper); color: var(--ss-accent-ink); border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; }

    /* ===== The exercise gallery dialog (ExerciseGallery.html, shared by both apps; PLAN-v1 §5.1.1) =====
       Desktop ≥1000px: filters | results | detail. Tablet: filters behind a button over the results; detail under the card.
       Phone <640px: full screen. Targets ≥44px; no sideways scroll; motion only when the viewer allows it. */
    .eg-overlay { align-items: center; justify-content: center; padding: 16px; }

    .eg-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px 6px; }
    .eg-head-text { min-width: 0; }
    .eg-head h3 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
    .eg-sub { font-size: 12px; color: var(--ss-text-muted); }
    .eg-close { flex: 0 0 auto; min-width: 44px; min-height: 44px; border: none; border-radius: 8px; background: var(--ss-page); color: var(--ss-text); font-size: 18px; cursor: pointer; }

    .eg-badge { display: inline-block; min-width: 20px; margin-left: 6px; padding: 1px 6px; border-radius: 10px; background: var(--ss-copper-dark); color: var(--ss-on-fill); font-size: 11px; }

    .eg-axis-head::after { content: "▾"; font-size: 10px; }
    .eg-axis-head[aria-expanded="false"]::after { content: "▸"; }

    .role-coach .role-icon { background: rgba(var(--ss-white-rgb), 0.18); color: var(--ss-on-fill); }
    .role-coach .role-desc { color: var(--ss-cream); }
    .role-coach:hover { box-shadow: 0 6px 16px rgba(var(--ss-copper-rgb), 0.45); }   /* no lift: moving the card pulls its hit area from under the pointer (it flickered) */
    .role-client { background: var(--ss-surface); color: var(--ss-heading); border: 1.5px solid var(--ss-heading); }
    .role-client .role-icon { background: var(--ss-page); color: var(--ss-heading); }
    .role-client .role-desc { color: var(--ss-text); opacity: 0.7; }
    .role-client:hover { background: var(--ss-page); }
    /* Tablet — light bump, same stacked layout, more breathing room. */
    @media (min-width: 640px) {
      .home-card { max-width: 480px; }
      .home-brand { padding: 48px 32px 32px; }
      .home-body { padding: 32px 32px 36px; }
    }
    /* Desktop — a deliberately wider tier: role tiles sit side-by-side
       under the brand header instead of stacking, so the card doesn't
       read as an oversized phone screen floating in empty space. */
    @media (min-width: 1024px) {
      .home-card { max-width: 640px; }
      .home-brand { padding: 52px 40px 36px; }
        .home-body { padding: 36px 40px 44px; }
      .home-actions { flex-direction: row; gap: 18px; }
      .role-card { flex: 1; padding: 22px 20px; }
      .role-icon { width: 48px; height: 48px; }
      .role-icon svg { width: 24px; height: 24px; }
    }
  </style>
</head>
