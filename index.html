  <style>
    /* ===== Home / Role Picker =====
       Mirrors the .login-page/.login-card/.login-brand pattern used by the
       Coach and Client login screens (Styles.html / ClientStyles.html) for
       visual consistency across the app, kept local here since Homepage.html
       doesn't include either app's stylesheet. loginCardIn keyframe and
       color tokens come from SharedStyles.html, included above.
       Mobile-first (priority 1 — a real visitor lands here on a phone):
       stacked role pills. Tablet (640px) is a light breathing-room bump.
       Desktop (1024px) grows into a wider card with the two role tiles
       side-by-side, but deliberately doesn't copy the login screens'
       split-brand-panel treatment — this is a choice screen, not a form,
       so it should read as its own thing. */
    .home-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; min-height: 100dvh; padding: 32px 16px; box-sizing: border-box; background:
        radial-gradient(circle at 15% -10%, var(--ss-green-soft) 0%, transparent 45%),
        radial-gradient(circle at 110% 110%, rgba(var(--ss-copper-rgb), 0.25) 0%, transparent 40%),
        linear-gradient(160deg, var(--ss-green) 0%, var(--ss-green-deep) 100%);
    }
    .home-card { width: 100%; max-width: 420px; background: var(--ss-surface); border-radius: 18px; overflow: hidden; text-align: center; box-shadow: 0 24px 60px rgba(var(--ss-green-deep-rgb), 0.35), 0 2px 8px rgba(var(--ss-green-deep-rgb), 0.12); animation: loginCardIn 0.5s cubic-bezier(0.16,1,0.3,1); }
    .home-brand { position: relative; overflow: hidden; background: linear-gradient(160deg, var(--ss-green) 0%, var(--ss-green-deep) 100%); padding: 40px 24px 28px; border-bottom: 4px solid var(--ss-copper); }
    .home-brand::after { content: ''; position: absolute; top: -70px; right: -60px; width: 200px; height: 200px; border-radius: 50%; border: 1px solid rgba(var(--ss-cream-rgb), 0.12); pointer-events: none; }
    .home-logo { max-width: 130px; width: 100%; height: auto; filter: drop-shadow(0 8px 18px rgba(var(--ss-black-rgb), 0.35)); position: relative; }
    .home-body { padding: 28px 24px 32px; }
    .home-subtitle { margin: 0 0 18px; color: var(--ss-text); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: 0.65; }
    .home-actions { display: flex; flex-direction: column; gap: 14px; }
    .role-card { display: flex; align-items: center; gap: 14px; text-decoration: none; text-align: left; padding: 16px 18px; border-radius: 12px; transition: 0.2s; box-sizing: border-box; }
    .role-icon { flex: 0 0 auto; width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .role-icon svg { width: 22px; height: 22px; }
    .role-text { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .role-label { font-family: 'League Spartan', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.8px; }
    .role-desc { font-size: 12px; letter-spacing: 0.2px; opacity: 0.8; }
    .role-arrow { flex: 0 0 auto; font-size: 18px; transition: transform 0.2s; }
    .role-card:hover .role-arrow { transform: translateX(3px); }
    .role-coach { background: linear-gradient(135deg, var(--ss-copper-dark) 0%, var(--ss-copper-deep) 100%); color: var(--ss-on-fill); box-shadow: 0 4px 12px rgba(var(--ss-copper-rgb), 0.35); }
    .role-coach .role-icon { background: rgba(var(--ss-white-rgb), 0.18); color: var(--ss-on-fill); }
    .role-coach .role-desc { color: var(--ss-cream); }
    .role-coach:hover { box-shadow: 0 6px 16px rgba(var(--ss-copper-rgb), 0.45); }   /* no lift: moving the card pulls its hit area from under the pointer (it flickered) */
    .role-client { background: var(--ss-surface); color: var(--ss-heading); border: 1.5px solid var(--ss-heading); }
    .role-client .role-icon { background: var(--ss-page); color: var(--ss-heading); }
    .role-client .role-desc { color: var(--ss-text); opacity: 0.7; }
    .role-client:hover { background: var(--ss-page); }
    /* Tablet — light bump, same stacked layout, more breathing room. */
    @media (min-width: 640px) {
      .home-card { max-width: 480px; }
      .home-brand { padding: 48px 32px 32px; }
      .home-body { padding: 32px 32px 36px; }
    }
    /* Desktop — a deliberately wider tier: role tiles sit side-by-side
       under the brand header instead of stacking, so the card doesn't
       read as an oversized phone screen floating in empty space. */
    @media (min-width: 1024px) {
      .home-card { max-width: 640px; }
      .home-brand { padding: 52px 40px 36px; }
        .home-body { padding: 36px 40px 44px; }
      .home-actions { flex-direction: row; gap: 18px; }
      .role-card { flex: 1; padding: 22px 20px; }
      .role-icon { width: 48px; height: 48px; }
      .role-icon svg { width: 24px; height: 24px; }
    }
  </style>
