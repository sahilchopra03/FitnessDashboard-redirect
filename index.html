<style>
  :root {
    --ss-green: #1A3626;
    --ss-green-deep: #0E1F16;
    --ss-cream: #F4F4F0;
    --ss-copper: #C17D59;
    --ss-copper-dark: #A5623F;
    --ss-charcoal: #2A332C;
    --ss-white: #FFFFFF;
  }
  body { font-family: 'Inter', sans-serif; background: var(--ss-cream); color: var(--ss-charcoal); margin: 0; padding: 0; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-container { max-width: 92%; width: 420px; margin: 24px auto; padding: 0 0 30px; background: var(--ss-white); border-radius: 14px; overflow: hidden; text-align: center; box-shadow: 0 12px 32px rgba(14,31,22,0.14); }
  .login-brand { background: linear-gradient(160deg, var(--ss-green) 0%, var(--ss-green-deep) 100%); padding: 30px 20px 22px; border-bottom: 4px solid var(--ss-copper); }
  .login-logo { max-width: 170px; width: 100%; height: auto; }
  .login-container h2 { margin: 26px 0 22px; color: var(--ss-green); font-size: 18px; letter-spacing: 1.5px; font-family: 'League Spartan', sans-serif; }
  .home-subtitle { margin: 22px 0 26px; color: var(--ss-charcoal); font-size: 13.5px; letter-spacing: 0.3px; opacity: 0.75; }
  .home-actions { padding: 0 26px; display: flex; flex-direction: column; gap: 14px; }
  .home-actions a.btn-primary, .home-actions a.btn-secondary { display: block; text-decoration: none; text-align: center; box-sizing: border-box; }
  .btn-primary { background: linear-gradient(135deg, var(--ss-copper) 0%, var(--ss-copper-dark) 100%); color: var(--ss-white); border: none; width: 100%; padding: 15px; font-weight: 700; font-family: 'League Spartan', sans-serif; font-size: 15px; letter-spacing: 1px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(193,125,89,0.45); }
  .btn-secondary { background: var(--ss-white); color: var(--ss-green); border: 1.5px solid var(--ss-green); width: 100%; padding: 15px; font-weight: 700; font-family: 'League Spartan', sans-serif; font-size: 15px; letter-spacing: 1.5px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
  .btn-secondary:hover { background: var(--ss-cream); }
</style>
